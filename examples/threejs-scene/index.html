<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cymonkey Three.js Experience</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #080b14;
        color: #f4f6ff;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      #experience {
        display: block;
        width: 100%;
        height: 100%;
      }

      #status {
        position: fixed;
        top: 20px;
        left: 20px;
        max-width: 320px;
        padding: 12px 14px;
        border: 1px solid rgb(255 255 255 / 14%);
        border-radius: 12px;
        background: rgb(8 11 20 / 72%);
        backdrop-filter: blur(12px);
        pointer-events: none;
      }

      #status strong,
      #status span {
        display: block;
      }

      #status span {
        margin-top: 4px;
        color: #aeb8d8;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <canvas id="experience" aria-label="Cymonkey Three.js experience"></canvas>
    <div id="status">
      <strong>Cymonkey Display Bridge</strong>
      <span id="summary">Waiting for presentation commands</span>
    </div>
    <script>
      window.__cymonkeyErrors = [];
      addEventListener("error", (event) => {
        window.__cymonkeyErrors.push(event.error?.stack || event.message);
      });
      addEventListener("unhandledrejection", (event) => {
        window.__cymonkeyErrors.push(event.reason?.stack || String(event.reason));
      });
    </script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
