<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cymonkey Web Presentation</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body, #presentation { width: 100%; min-height: 100%; margin: 0; }
      body { min-height: 100vh; background: #08101f; color: #f5f7ff; }
      #presentation { padding: 48px; }
      .presentation-stack { display: grid; gap: 18px; max-width: 960px; margin: 0 auto; }
      .presentation-card { padding: 24px; border: 1px solid #26375e; border-radius: 18px; background: #101b33; box-shadow: 0 18px 50px #0005; }
      .presentation-text { color: #b9c6e8; line-height: 1.6; }
      .presentation-button { border: 0; border-radius: 999px; padding: 11px 18px; background: #8067ff; color: white; font: inherit; cursor: pointer; }
      .presentation-button:hover { background: #9b88ff; }
      .presentation-empty { color: #8997bd; text-align: center; padding: 80px 20px; }
    </style>
  </head>
  <body>
    <main id="presentation" aria-live="polite"><div class="presentation-empty">Waiting for a presentation document</div></main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
