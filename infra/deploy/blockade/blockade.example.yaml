apiVersion: blockade.config/v1alpha1
providers:
  - id: local-yolo-sam
    provider: local-ultralytics
    model: yolo-sam@1.0.0
    workers: 1
    timeout: 2m
    maxPayloadBytes: 8388608

# Blockade launches this source package with its installed python@3.12.8
# runtime. The provider bundle includes its Python source and vendored packages.
# The model bundle must contain one `yolo` .pt artifact and one `sam` .pt artifact.
