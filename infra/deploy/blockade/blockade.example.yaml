apiVersion: blockade.config/v1alpha1
engines:
  - id: local-yolo-sam
    kind: local-ultralytics
    command: [python3, infra/deploy/blockade/worker.py]
    workers: 1
    yoloModel: /models/yolo11n.pt
    samModel: /models/sam2_b.pt

# Provider-enabled Blockade builds can also declare adapters registered by
# their compiled provider packages. Secret values stay in the environment.
# providerAdapters:
#   - id: hosted-vision
#     kind: registered-provider-kind
#     timeout: 30s
#     maxPayloadBytes: 8388608
#     settings:
#       model: provider-model-name
#     secrets:
#       apiToken:
#         env: BLOCKADE_HOSTED_VISION_TOKEN

# Browser-local WebGPU inference is included in the stock Blockade binary.
# Model loading is asynchronous; use `cymonkey blockade serve` and gate traffic on
# /healthz so a cold cache can finish downloading before the first request.
# providerAdapters:
#   - id: browser-vlm
#     kind: webllm
#     timeout: 2m
#     maxPayloadBytes: 8388608
#     settings:
#       model: Phi-3.5-vision-instruct-q4f16_1-MLC
#       cacheDirectory: /var/cache/blockade/webllm
#       maxTokens: "1024"
