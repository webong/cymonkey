apiVersion: cymonkey.config/v1alpha1
kind: CymonkeyHost

# Export CYMONKEY_DISPLAY_TOKEN and CYMONKEY_CONTENT_TOKEN before running the
# host. Cymonkey keeps both service credentials outside this manifest.
services:
  display.interaction:
    endpoint: http://127.0.0.1:7391
    tokenEnvironment: CYMONKEY_DISPLAY_TOKEN
  content.interpretation:
    endpoint: http://127.0.0.1:8091
    tokenEnvironment: CYMONKEY_CONTENT_TOKEN

# Cymonkey supervises library services through its `cymy` command.
components:
  - id: content-service
    command:
      - cymy
      - content
      - serve
      - --config
      - scripts/deploy/content/content.example.yaml
      - --bind
      - 127.0.0.1:8091
      - --token-env
      - CYMONKEY_CONTENT_TOKEN
    environment:
      CYMONKEY_CONTENT_TOKEN: ${CYMONKEY_CONTENT_TOKEN}

  - id: display-service
    command:
      - cymy
      - display
      - serve
      - --bind
      - 127.0.0.1:7391
      - --token-env
      - CYMONKEY_DISPLAY_TOKEN
    environment:
      CYMONKEY_DISPLAY_TOKEN: ${CYMONKEY_DISPLAY_TOKEN}
